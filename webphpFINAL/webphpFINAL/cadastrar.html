<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar produto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="p-4">
    <main class="container" style="max-width: 760px;">
        <h1 class="h3 mb-4">Cadastrar produto</h1>

        <form action="salvar.php" method="post" onsubmit="return validar()">
            <div class="mb-3">
                <label class="form-label" for="nome">Nome</label>
                <input class="form-control" type="text" name="nome" id="nome" maxlength="120" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="descricao">Descrição</label>
                <textarea class="form-control" name="descricao" id="descricao" rows="4"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label" for="preco">Preço</label>
                <input class="form-control" type="number" name="preco" id="preco" step="0.01" min="0.01" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="quantidade">Quantidade</label>
                <input class="form-control" type="number" name="quantidade" id="quantidade" min="0" step="1" required>
            </div>

            <div class="mb-4">
                <label class="form-label" for="data_cadastro">Data de cadastro</label>
                <input class="form-control" type="date" name="data_cadastro" id="data_cadastro" required>
            </div>

            <button class="btn btn-success" type="submit">Salvar</button>
            <a class="btn btn-secondary" href="index.php">Cancelar</a>
        </form>
    </main>

    <script src="js/index.js"></script>
</body>
</html>
